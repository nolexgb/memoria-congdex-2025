<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propuesta interactiva | Junta directiva, entidades y proyectos</title>
  <style>
    .memoria-interactiva{
      --mi-bg:#f4f7f8;
      --mi-panel:#ffffff;
      --mi-panel-2:#eef6f2;
      --mi-text:#15323a;
      --mi-muted:#5c7278;
      --mi-primary:#2d9b61;
      --mi-primary-dark:#217448;
      --mi-secondary:#6f8fda;
      --mi-accent:#f18b53;
      --mi-line:#dce6e4;
      --mi-shadow:0 12px 30px rgba(16,40,46,.08);
      --mi-radius:22px;
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:linear-gradient(180deg,#f7fbfa 0%, #eef4f6 100%);
      color:var(--mi-text);
    }

    .memoria-interactiva *, .memoria-interactiva *::before, .memoria-interactiva *::after{box-sizing:border-box}
    .memoria-interactiva a{text-decoration:none}
    .memoria-interactiva .mi-wrap{width:min(1240px, calc(100% - 32px));margin:auto}

    .memoria-interactiva .mi-hero{
      position:relative;overflow:hidden;padding:72px 0 34px;
      background:
        radial-gradient(circle at 20% 20%, rgba(111,143,218,.18), transparent 24%),
        radial-gradient(circle at 80% 10%, rgba(45,155,97,.14), transparent 20%),
        linear-gradient(180deg, rgba(255,255,255,.96), rgba(245,249,249,.94));
      border-bottom:1px solid rgba(21,50,58,.06);
    }
    .memoria-interactiva .mi-hero::after{
      content:"";position:absolute;inset:auto -10% -60px -10%;height:140px;
      background:radial-gradient(ellipse at center, rgba(45,155,97,.18), transparent 65%);pointer-events:none;
    }
    .memoria-interactiva .mi-eyebrow{
      display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;
      background:#fff;border:1px solid rgba(21,50,58,.08);box-shadow:var(--mi-shadow);
      color:var(--mi-primary-dark);font-weight:700;font-size:.9rem;
    }
    .memoria-interactiva h1{margin:18px 0 14px;font-size:clamp(2rem,4vw,4rem);line-height:1.02;max-width:850px;letter-spacing:-.04em}
    .memoria-interactiva .mi-lead{max-width:880px;color:var(--mi-muted);font-size:1.05rem;line-height:1.7;margin:0 0 28px}
    .memoria-interactiva .mi-hero-grid{display:grid;grid-template-columns:1.25fr .95fr;gap:28px;align-items:center}
    .memoria-interactiva .mi-hero-card{
      background:rgba(255,255,255,.88);border:1px solid rgba(21,50,58,.08);border-radius:28px;
      padding:22px;box-shadow:var(--mi-shadow);backdrop-filter:blur(10px);
    }

    .memoria-interactiva .mi-node-map{
      position:relative;min-height:420px;border-radius:24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.88), rgba(238,246,242,.84)),
        repeating-linear-gradient(0deg, transparent 0 31px, rgba(45,155,97,.05) 31px 32px),
        repeating-linear-gradient(90deg, transparent 0 31px, rgba(111,143,218,.05) 31px 32px);
      overflow:hidden;
    }
    .memoria-interactiva .mi-node,
    .memoria-interactiva .mi-center-node{
      position:absolute;display:grid;place-items:center;text-align:center;border-radius:50%;cursor:pointer;
      transition:transform .25s ease, box-shadow .25s ease, filter .25s ease;user-select:none;
    }
    .memoria-interactiva .mi-center-node{
      inset:50% auto auto 50%;transform:translate(-50%, -50%);width:180px;height:180px;
      background:linear-gradient(180deg, #fafffd, #daf0e1);border:6px solid rgba(45,155,97,.18);
      box-shadow:0 18px 45px rgba(45,155,97,.18);z-index:3;font-weight:800;color:var(--mi-primary-dark);padding:24px;
    }
    .memoria-interactiva .mi-center-node small{display:block;color:var(--mi-muted);font-weight:600;margin-top:6px}
    .memoria-interactiva .mi-node{width:118px;height:118px;padding:14px;color:#fff;font-weight:700;box-shadow:0 10px 22px rgba(21,50,58,.16);z-index:2}
    .memoria-interactiva .mi-node.mi-blue{background:linear-gradient(180deg, #81a0eb, #6283d8)}
    .memoria-interactiva .mi-node.mi-green{background:linear-gradient(180deg, #46b97b, #2a965d)}
    .memoria-interactiva .mi-node.mi-dark{background:linear-gradient(180deg, #35695b, #23473d)}
    .memoria-interactiva .mi-node.mi-orange{background:linear-gradient(180deg, #f4a26f, #e27d46)}
